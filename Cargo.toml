[package]
name = "emailyzer"
version = "0.1.0"
edition = "2024"
authors = ["Malhar Vora <mlvora.2010@gmail.com>"]
description = "Analyze your email account"
readme = "README.md"
repository = "https://github.com/vbmade2000/emailyzer"
license-file = "LICENSE"
keywords = ["email, analyze, internet"]

[dependencies]
anyhow = "1.0.104"
rusqlite = "0.40.2"
imap = "2.4.1"
native-tls = "0.2.18"
serde = "1.0.229"
serde_json = "1.0.151"
tokio-imap = "0.5.0"
tokio = { version= "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features=["env-filter"] }
clap = { version = "4.6.6", features=["derive"] }
comfy-table = "8.0.0"
